
[project]
name = "bgmi"
version = "0.1.0"
description = "BGMI kill-feed detection and live scoreboard"
readme = "README.md"
authors = [
    { name = "Satvik-Singh192", email = "satviksingh192@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "numpy",
    "opencv-python",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "pillow",
    "ultralytics>=8.4.177",
    "uvicorn[standard]",
]

# This is a script-based application, not an installable package.
[tool.uv]
package = false
