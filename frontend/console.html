<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGMI Scoreboard – Operator Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <!-- ── Topbar ───────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-pip"></span>
      BGMI SCOREBOARD
    </div>
    <nav class="topbar-nav">
      <a class="nav-link active" href="console.html">Console</a>
      <a class="nav-link" href="setup.html">Setup</a>
      <a class="nav-link" href="history.html">History</a>
    </nav>
    <div class="topbar-right">
      <span id="match-badge" class="match-status live">LIVE · M1</span>
      <span id="ws-badge" class="ws-badge">Connecting…</span>
    </div>
  </header>

  <!-- ── Status Strip ─────────────────────────────────── -->
  <div class="status-strip">
    <div class="stat-box">
      <div class="stat-val accent" id="s-kills">0</div>
      <div class="stat-lbl">Total Kills</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="s-teams">8</div>
      <div class="stat-lbl">Teams Alive</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="s-match">1 / 6</div>
      <div class="stat-lbl">Match</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="s-map">—</div>
      <div class="stat-lbl">Map</div>
    </div>
    <div class="stat-box" style="border-right:none;">
      <div class="stat-val" id="s-leader">—</div>
      <div class="stat-lbl">Leading Team</div>
    </div>
  </div>

  <!-- ── Main Content ──────────────────────────────────── -->
  <div style="display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:16px; flex:1; min-height:0;">

    <!-- LEFT: Scoreboard Table + Match Controls -->
    <div style="display:flex; flex-direction:column; gap:12px; min-height:0; overflow:auto;">

      <!-- Match Controls Row -->
      <div class="card">
        <div class="card-body" style="padding:12px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" onclick="setStatus('LIVE')">▶ Resume</button>
          <button class="btn btn-secondary btn-sm" onclick="setStatus('PAUSED')">⏸ Pause</button>
          <div style="width:1px; height:22px; background:var(--border); margin:0 4px;"></div>
          <button class="btn btn-success btn-sm" onclick="endMatch()">✓ End Match</button>
          <button class="btn btn-secondary btn-sm" onclick="newMatch()">+ New Match</button>
          <div style="width:1px; height:22px; background:var(--border); margin:0 4px;"></div>
          <button class="btn btn-danger btn-sm" onclick="undoKill()">↩ Undo Kill</button>
          <div style="margin-left:auto;">
            <span style="font-size:11px; color:var(--muted);">Last event: <span id="last-event-txt">—</span></span>
          </div>
        </div>
      </div>

      <!-- Live Standings Table -->
      <div class="card" style="flex:1; min-height:0; overflow:auto;">
        <div class="card-header">
          Live Standings
          <span style="font-size:11px; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0;" id="tbl-updated">—</span>
        </div>
        <table class="data-table" id="standings-table">
          <thead>
            <tr>
              <th style="width:42px;">#</th>
              <th>Team</th>
              <th class="text-right" style="width:60px;">Kills</th>
              <th class="text-right" style="width:60px;">Knocks</th>
              <th class="text-right" style="width:60px;">Place</th>
              <th class="text-right" style="width:64px;">Total</th>
              <th style="width:90px;"></th>
            </tr>
          </thead>
          <tbody id="standings-body">
            <tr><td colspan="7" style="text-align:center; color:var(--muted); padding:32px;">Waiting for data…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- RIGHT: Operator Action Grid -->
    <div style="display:flex; flex-direction:column; gap:12px; overflow:auto;">
      <div class="card" style="flex:1; min-height:0; overflow:auto;">
        <div class="card-header">
          Operator Actions
          <span style="font-size:11px; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0;">click to score</span>
        </div>
        <div class="card-body" style="padding:12px;">
          <div class="op-grid" id="op-grid">
            <!-- rendered by JS -->
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
  // ── Utility ─────────────────────────────────────────────
  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(path, method = 'GET', body) {
    try {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    } catch (e) {
      toast('Network error: ' + e.message, 'error');
    }
  }

  // ── Match controls ───────────────────────────────────────
  async function setStatus(s) {
    const r = await api('/api/match/status', 'POST', { status: s });
    if (r) toast(s === 'LIVE' ? '▶ Match resumed' : '⏸ Match paused', 'info');
  }

  async function endMatch() {
    if (!confirm('End this match and calculate placement points?')) return;
    const r = await api('/api/match/end', 'POST');
    if (r) toast('Match ended — placement points assigned', 'success');
  }

  async function newMatch() {
    if (!confirm('Start next match? Current standings will be archived.')) return;
    const r = await api('/api/match/new', 'POST');
    if (r) toast('New match started', 'success');
  }

  async function undoKill() {
    const r = await api('/api/undo', 'POST');
    if (r?.status === 'ok') toast('↩ Last kill undone', 'info');
    else toast('Nothing to undo', 'error');
  }

  // ── Kill / Knock / Eliminate ─────────────────────────────
  async function sendKill(team, delta) {
    const r = await api('/api/kill', 'POST', { team, delta });
    if (r?.status === 'blocked') toast(r.message, 'error');
  }

  async function sendKnock(team) {
    await api('/api/knock', 'POST', { team, delta: 1 });
  }

  async function eliminateTeam(team) {
    if (!confirm(`Eliminate ${team}?`)) return;
    await api('/api/eliminate', 'POST', { team });
    toast(`${team} eliminated`, 'info');
  }

  // ── Render ───────────────────────────────────────────────
  let prevTotals = {};

  function renderConsole(snap) {
    const teams      = snap.teams || [];
    const matchNum   = snap.match_number || 1;
    const totalM     = snap.total_matches || 6;
    const mapName    = snap.map || '—';
    const status     = snap.status || 'LIVE';
    const pKills     = snap.player_kills || {};

    // Update status strip
    const totalKills = teams.reduce((s, t) => s + (t.kills || 0), 0);
    const alive      = teams.filter(t => !t.eliminated).length;
    const leader     = teams.reduce((a, b) => (b.total ?? 0) > (a.total ?? 0) ? b : a, teams[0] || {});

    document.getElementById('s-kills').textContent  = totalKills;
    document.getElementById('s-teams').textContent  = alive;
    document.getElementById('s-match').textContent  = `${matchNum} / ${totalM}`;
    document.getElementById('s-map').textContent    = mapName.split(' ')[0];
    document.getElementById('s-leader').textContent = leader?.team || '—';

    // Match badge
    const badge = document.getElementById('match-badge');
    badge.textContent = `${status} · M${matchNum}`;
    badge.className   = `match-status ${status === 'LIVE' ? 'live' : status === 'PAUSED' ? 'paused' : 'ended'}`;

    // timestamp
    document.getElementById('tbl-updated').textContent = new Date().toLocaleTimeString();

    // Events log last entry
    const evLog = snap.events_log || [];
    if (evLog.length > 0) {
      const last = evLog[evLog.length - 1];
      document.getElementById('last-event-txt').textContent =
        `${last.player || last.team} +${last.delta} kill`;
    }

    // Sort teams
    const sorted = [...teams].sort((a, b) => (b.total ?? 0) - (a.total ?? 0));

    // Standings table
    const tbody = document.getElementById('standings-body');
    tbody.innerHTML = '';
    sorted.forEach((t, i) => {
      const rank   = i + 1;
      const kills  = t.kills  ?? 0;
      const knocks = t.knocks ?? 0;
      const place  = t.place  ?? 0;
      const total  = t.total  ?? (kills + place);
      const isElim = Boolean(t.eliminated);
      const changed = prevTotals[t.team] !== undefined && prevTotals[t.team] !== total;
      prevTotals[t.team] = total;

      const tr = document.createElement('tr');
      if (isElim) tr.className = 'eliminated';
      if (rank === 1) tr.classList.add('rank-1');
      if (changed) {
        tr.classList.add('flash');
        setTimeout(() => tr.classList.remove('flash'), 800);
      }

      const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
      tr.innerHTML = `
        <td><span class="rank-badge ${rankClass}">${rank}</span></td>
        <td>
          <div class="flex items-center gap-8">
            <span class="team-bar" style="background:${t.color || '#94a3b8'}"></span>
            <span class="fw-700">${t.team}</span>
            ${isElim ? '<span style="font-size:10px; color:var(--danger); margin-left:4px;">ELIM</span>' : ''}
          </div>
        </td>
        <td class="text-right text-accent fw-700">${kills}</td>
        <td class="text-right text-muted">${knocks}</td>
        <td class="text-right text-muted">${place}</td>
        <td class="text-right fw-800" style="font-size:16px; color:${rank===1?'var(--amber)':'var(--text)'}">${total}</td>
        <td class="text-right">
          ${isElim ? '' : `<button class="btn btn-danger btn-sm btn-icon sm" title="Eliminate" onclick="eliminateTeam('${t.team}')">✕</button>`}
        </td>
      `;
      tbody.appendChild(tr);
    });

    // Operator grid
    const grid = document.getElementById('op-grid');
    grid.innerHTML = '';
    sorted.forEach(t => {
      const isElim = Boolean(t.eliminated);
      const card = document.createElement('div');
      card.className = `op-card${isElim ? ' eliminated' : ''}`;
      card.innerHTML = `
        <div class="op-card-header">
          <span class="team-bar" style="background:${t.color || '#94a3b8'}; height:20px;"></span>
          <div>
            <div class="op-team-name">${t.team}</div>
            <div class="op-kills">${t.kills || 0}K · ${t.knocks || 0}KN · ${t.total || 0}PTS</div>
          </div>
        </div>
        <div class="op-btns">
          <button class="op-btn plus"  onclick="sendKill('${t.team}', 1)">+1</button>
          <button class="op-btn minus" onclick="sendKill('${t.team}', -1)">−</button>
          <button class="op-btn knock" onclick="sendKnock('${t.team}')">KNK</button>
          ${!isElim ? `<button class="op-btn elim" onclick="eliminateTeam('${t.team}')">OUT</button>` : ''}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // ── WebSocket ────────────────────────────────────────────
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
               + (location.host || '127.0.0.1:8000')
               + '/scoreboard';
  const wsBadge = document.getElementById('ws-badge');
  let ws;

  function connect() {
    try {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        wsBadge.textContent = 'LIVE';
        wsBadge.className   = 'ws-badge live';
      };
      ws.onmessage = e => {
        try { renderConsole(JSON.parse(e.data)); } catch {}
      };
      ws.onclose = () => {
        wsBadge.textContent = 'Reconnecting…';
        wsBadge.className   = 'ws-badge';
        setTimeout(connect, 2500);
      };
      ws.onerror = () => ws.close();
    } catch { setTimeout(connect, 2500); }
  }

  // Initial load
  fetch('/scoreboard').then(r => r.json()).then(renderConsole).catch(() => {});
  connect();
</script>
</body>
</html>
