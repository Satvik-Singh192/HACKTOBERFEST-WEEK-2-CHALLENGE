<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGMI Scoreboard – Match History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <!-- ── Topbar ── -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-pip"></span>
      BGMI SCOREBOARD
    </div>
    <nav class="topbar-nav">
      <a class="nav-link" href="console.html">Console</a>
      <a class="nav-link" href="setup.html">Setup</a>
      <a class="nav-link active" href="history.html">History</a>
      <a class="nav-link" href="overlay.html" target="_blank" title="Points Table Overlay (OBS)">📺 Points Overlay</a>
      <a class="nav-link" href="fraggers_overlay.html" target="_blank" title="Top Fraggers & MVP Overlay (OBS)">🎖️ Fraggers Overlay</a>
    </nav>
    <div class="topbar-right">
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">↓ Export CSV</button>
      <button class="btn btn-danger btn-sm" onclick="clearHistory()">✕ Clear History</button>
    </div>
  </header>

  <!-- ── Tabs ── -->
  <div style="display:flex; border-bottom:1px solid var(--border); background:var(--surface); padding:0 20px; gap:0;">
    <button class="nav-link active" id="tab-overall" onclick="switchTab('overall')" style="border:none; background:none; height:48px; cursor:pointer;">Overall Standings</button>
    <button class="nav-link" id="tab-matches" onclick="switchTab('matches')" style="border:none; background:none; height:48px; cursor:pointer;">Per-Match Results</button>
  </div>

  <!-- ── Status Strip ── -->
  <div class="status-strip">
    <div class="stat-box">
      <div class="stat-val accent" id="h-matches">0</div>
      <div class="stat-lbl">Matches Played</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="h-leader">—</div>
      <div class="stat-lbl">Overall Leader</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="h-total-kills">0</div>
      <div class="stat-lbl">Total Kills</div>
    </div>
    <div class="stat-box" style="border-right:none;">
      <div class="stat-val" id="h-wwcd">—</div>
      <div class="stat-lbl">Most WWCD</div>
    </div>
  </div>

  <!-- ── Tab Contents ── -->
  <div style="padding:16px; flex:1; overflow:auto;">

    <!-- OVERALL TAB -->
    <div id="view-overall">
      <div class="card">
        <div class="card-header">
          Overall Tournament Standings
          <span style="font-size:11px; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0;" id="last-updated">—</span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:42px;">#</th>
              <th>Team</th>
              <th class="text-right" style="width:80px;">Matches</th>
              <th class="text-right" style="width:60px;">WWCD</th>
              <th class="text-right" style="width:60px;">Kills</th>
              <th class="text-right" style="width:70px;">Place Pts</th>
              <th class="text-right" style="width:70px; color:var(--accent);">Total</th>
            </tr>
          </thead>
          <tbody id="overall-body">
            <tr><td colspan="7" style="text-align:center; color:var(--muted); padding:40px;">No match history yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- PER-MATCH TAB -->
    <div id="view-matches" style="display:none;">
      <div style="display:flex; flex-direction:column; gap:12px;" id="matches-list">
        <div style="text-align:center; color:var(--muted); padding:40px;">No completed matches yet.</div>
      </div>
    </div>

  </div>
</div>

<div id="toast-container"></div>

<script>
  // ── Utility ───────────────────────────────────────────────
  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(path, method = 'GET', body) {
    try {
      const r = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return r.json();
    } catch (e) { toast('Network error', 'error'); }
  }

  // ── Tabs ─────────────────────────────────────────────────
  function switchTab(tab) {
    const isOverall = tab === 'overall';
    document.getElementById('view-overall').style.display  = isOverall ? '' : 'none';
    document.getElementById('view-matches').style.display  = isOverall ? 'none' : '';
    document.getElementById('tab-overall').className  = 'nav-link' + (isOverall ? ' active' : '');
    document.getElementById('tab-matches').className  = 'nav-link' + (!isOverall ? ' active' : '');
  }

  // ── Load ─────────────────────────────────────────────────
  async function loadHistory() {
    const data = await api('/api/history') || {};
    const standings = data.overall_standings || [];
    const matches   = data.matches || [];

    // Status strip
    document.getElementById('h-matches').textContent  = matches.length;

    if (standings.length) {
      const leader = standings[0];
      document.getElementById('h-leader').textContent     = leader.team || '—';
      document.getElementById('h-total-kills').textContent = standings.reduce((s, t) => s + (t.kills || 0), 0);

      // Most WWCD
      const mostWwcd = standings.reduce((a, b) => (b.wwcd || 0) > (a.wwcd || 0) ? b : a, standings[0] || {});
      document.getElementById('h-wwcd').textContent = mostWwcd?.team || '—';
    }

    renderOverall(standings);
    renderMatches(matches);
    document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
  }

  function renderOverall(standings) {
    const tbody = document.getElementById('overall-body');
    if (!standings.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:40px;">No match history yet.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    standings.forEach((t, i) => {
      const rank   = i + 1;
      const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
      const tr = document.createElement('tr');
      if (rank === 1) tr.classList.add('rank-1');
      tr.innerHTML = `
        <td><span class="rank-badge ${rankClass}">${rank}</span></td>
        <td>
          <div class="flex items-center gap-8">
            <span class="team-bar" style="background:${t.color || '#94a3b8'}"></span>
            <span class="fw-700">${t.team}</span>
            ${rank === 1 ? '<span style="font-size:10px;color:var(--amber);margin-left:4px;">👑 LEADER</span>' : ''}
          </div>
        </td>
        <td class="text-right text-muted">${t.matches_played ?? 0}</td>
        <td class="text-right" style="color:var(--accent); font-weight:700;">${t.wwcd ?? 0}</td>
        <td class="text-right">${t.kills ?? 0}</td>
        <td class="text-right text-muted">${t.place ?? 0}</td>
        <td class="text-right fw-800" style="font-size:16px; color:${rank===1?'var(--amber)':'var(--accent)'};">${t.total ?? 0}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderMatches(matches) {
    const list = document.getElementById('matches-list');
    if (!matches.length) {
      list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;">No completed matches yet.</div>';
      return;
    }

    list.innerHTML = '';
    [...matches].reverse().forEach(m => {
      const teams = (m.teams || []).slice().sort((a, b) => (b.total ?? 0) - (a.total ?? 0));
      const winner = teams[0];

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          Match ${m.match_number} · ${m.map || ''}
          <span style="font-size:11px; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0;">
            Winner: <strong style="color:var(--amber);">${winner?.team || '—'}</strong>
            · ${m.timestamp ? new Date(m.timestamp).toLocaleString() : ''}
          </span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:42px;">#</th>
              <th>Team</th>
              <th class="text-right" style="width:60px;">Kills</th>
              <th class="text-right" style="width:70px;">Place Pts</th>
              <th class="text-right" style="width:70px;">Total</th>
            </tr>
          </thead>
          <tbody>
            ${teams.map((t, i) => {
              const rank = i + 1;
              const rankClass = rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
              return `
                <tr class="${rank===1?'rank-1':''}">
                  <td><span class="rank-badge ${rankClass}">${rank}</span></td>
                  <td>
                    <div class="flex items-center gap-8">
                      <span class="team-bar" style="background:${t.color||'#94a3b8'}"></span>
                      <span class="fw-700">${t.team}</span>
                    </div>
                  </td>
                  <td class="text-right text-accent fw-700">${t.kills??0}</td>
                  <td class="text-right text-muted">${t.place??0}</td>
                  <td class="text-right fw-800" style="color:${rank===1?'var(--amber)':'var(--text)'};">${t.total??0}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
      list.appendChild(card);
    });
  }

  // ── Actions ───────────────────────────────────────────────
  async function exportCSV() {
    window.open('/api/history/export-csv', '_blank');
  }

  async function clearHistory() {
    if (!confirm('Clear all match history? This cannot be undone.')) return;
    await api('/api/history/clear', 'POST');
    toast('History cleared', 'info');
    loadHistory();
  }

  // Init
  loadHistory();
</script>
</body>
</html>
