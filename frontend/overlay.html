<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BGMI Live Points Table – Opaque Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       BGMI LIVE SCOREBOARD — 100% OPAQUE OBS OVERLAY
       Scoreboard chassis is 100% SOLID OPAQUE (hides in-game HUD).
       Everything outside the chassis is 100% ALPHA TRANSPARENT.
       ============================================================ */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: normal;
      background: transparent !important;
      background-color: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
    }

    html, body {
      background: transparent !important;
      background-color: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      color: #E2E8F0;
      font-family: 'Rajdhani', 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Solid Opaque Chassis: Sleek, compact width to fit 16+ teams */
    #overlay-wrap {
      width: 240px;
      background: #0B0E14 !important; /* ONLY the scoreboard box is opaque */
      border: 1.5px solid #232B38;
      border-top: 3px solid #F97316; /* BGMI Orange accent bar */
      border-radius: 4px;
      box-shadow: none !important; /* No shadow halo bleeding onto gameplay */
      overflow: hidden;
      margin: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      opacity: 1;
    }

    #overlay-wrap.hidden {
      opacity: 0 !important;
      transform: translateY(-8px);
      pointer-events: none;
    }

    /* Top Tournament Header */
    .ov-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 5px;
      background: #121721; /* Solid dark header */
      border-bottom: 1.5px solid #1C2330;
    }

    .ov-brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ov-brand-bar {
      width: 3px;
      height: 13px;
      background: #F97316;
      border-radius: 2px;
    }

    .ov-title {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .ov-match-tag {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #94A3B8;
      background: #19202D;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #283344;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #EF4444; /* red until connected */
      transition: background 0.3s;
    }
    .live-dot.connected {
      background: #22C55E; /* green when live */
      box-shadow: 0 0 5px #22C55E;
    }

    /* Column Headers */
    .ov-col-hdr {
      display: grid;
      grid-template-columns: 24px 1fr 30px 36px;
      align-items: center;
      padding: 3px 8px;
      background: #0E121A;
      border-bottom: 1px solid #1C2433;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #64748B;
    }

    /* Team Rows List */
    .ov-rows {
      display: flex;
      flex-direction: column;
      background: #0B0E14;
    }

    .ov-row {
      display: grid;
      grid-template-columns: 24px 1fr 30px 36px;
      align-items: center;
      padding: 3.5px 8px;
      background: #0D1118;
      border-bottom: 1px solid #151B27;
      transition: background 0.25s;
    }

    .ov-row:nth-child(even) {
      background: #101520; /* subtle zebra stripe for high visibility */
    }

    .ov-row:last-child {
      border-bottom: none;
    }

    /* Top Rank Highlights */
    .ov-row.rank-1 {
      background: #17181F;
      border-left: 2.5px solid #F59E0B;
    }
    .ov-row.rank-2 {
      background: #111624;
      border-left: 2.5px solid #38BDF8;
    }
    .ov-row.rank-3 {
      background: #14161C;
      border-left: 2.5px solid #D97706;
    }

    /* Rank Number Badge */
    .ov-rank {
      font-size: 11.5px;
      font-weight: 800;
      color: #64748B;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .ov-row.rank-1 .ov-rank { color: #FBBF24; }
    .ov-row.rank-2 .ov-rank { color: #7DD3FC; }
    .ov-row.rank-3 .ov-rank { color: #F59E0B; }

    /* Team Name & Color Bar */
    .ov-team {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      padding-right: 3px;
    }

    .ov-bar {
      width: 3px;
      height: 13px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .ov-name {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: #F1F5F9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Elimination state */
    .ov-row.eliminated {
      background: #0A0C10 !important;
      opacity: 0.45;
    }
    .ov-row.eliminated .ov-name {
      text-decoration: line-through;
      color: #94A3B8;
    }
    .ov-elim-pill {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: .06em;
      color: #EF4444;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 2px;
      padding: 0 3px;
      margin-left: 3px;
    }

    /* Kills & Points Columns */
    .ov-kills {
      font-size: 11.5px;
      font-weight: 700;
      color: #94A3B8;
      text-align: right;
      padding-right: 4px;
      font-variant-numeric: tabular-nums;
    }

    .ov-pts {
      font-size: 12.5px;
      font-weight: 800;
      color: #F97316;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .ov-row.rank-1 .ov-pts { color: #FBBF24; }

    /* Flash highlight when points update */
    @keyframes flash-change {
      0%   { background-color: #372A1B !important; }
      100% { background-color: inherit; }
    }
    .row-flash {
      animation: flash-change 0.9s ease;
    }

    /* Top Fragger / MVP Footer */
    .ov-fragger-card {
      background: #0E121A;
      border-top: 1.5px solid #1E2738;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .ov-fragger-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }
    .ov-fragger-tag {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 2px;
      padding: 1px 4px;
      flex-shrink: 0;
    }
    .ov-fragger-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      line-height: 1.15;
    }
    .ov-fragger-name {
      font-size: 11px;
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ov-fragger-team {
      font-size: 8px;
      font-weight: 700;
      color: #94A3B8;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ov-fragger-stat {
      display: flex;
      align-items: baseline;
      gap: 3px;
      flex-shrink: 0;
    }
    .ov-fragger-kills {
      font-size: 14px;
      font-weight: 800;
      color: #F59E0B;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .ov-fragger-lbl {
      font-size: 8px;
      font-weight: 800;
      color: #64748B;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>

<div id="overlay-wrap">
  <!-- Solid Header -->
  <div class="ov-header">
    <div class="ov-brand">
      <div class="ov-brand-bar"></div>
      <span class="ov-title" id="ov-title">POINTS TABLE</span>
    </div>
    <div class="ov-match-tag">
      <span class="live-dot" id="live-dot"></span>
      <span id="ov-match-text">M1 · LIVE</span>
    </div>
  </div>

  <!-- Column Labels -->
  <div class="ov-col-hdr">
    <span>#</span>
    <span>TEAM</span>
    <span style="text-align:right; padding-right:6px;">K</span>
    <span style="text-align:right;">PTS</span>
  </div>

  <!-- Team Rows -->
  <div class="ov-rows" id="ov-rows">
    <!-- Populated immediately by JS with default teams, updated live via WS & REST -->
  </div>

  <!-- Top Fragger / MVP Footer -->
  <div class="ov-fragger-card" id="ov-fragger-card">
    <div class="ov-fragger-left">
      <span class="ov-fragger-tag">MVP</span>
      <span class="ov-bar" id="ov-frag-bar" style="background:#F97316; height:12px;"></span>
      <div class="ov-fragger-details">
        <span class="ov-fragger-name" id="ov-frag-name">—</span>
        <span class="ov-fragger-team" id="ov-frag-team">—</span>
      </div>
    </div>
    <div class="ov-fragger-stat">
      <span class="ov-fragger-kills" id="ov-frag-kills">0</span>
      <span class="ov-fragger-lbl">KILLS</span>
    </div>
  </div>
</div>

<script>
  const rowsEl   = document.getElementById('ov-rows');
  const titleEl  = document.getElementById('ov-title');
  const matchEl  = document.getElementById('ov-match-text');
  const liveDot  = document.getElementById('live-dot');

  // Track point totals to trigger orange flash animation on changes
  const previousPoints = {};

  // Standard tournament teams shown instantly while live data connects
  const defaultFallbackTeams = [
    { rank: 1,  team: "FLx",         color: "#38BDF8", kills: 0, total: 0, eliminated: false },
    { rank: 2,  team: "SANDHU",      color: "#F59E0B", kills: 0, total: 0, eliminated: false },
    { rank: 3,  team: "TEAM 3",      color: "#10B981", kills: 0, total: 0, eliminated: false },
    { rank: 4,  team: "NEMESIS",     color: "#EF4444", kills: 0, total: 0, eliminated: false },
    { rank: 5,  team: "DEVILS",      color: "#8B5CF6", kills: 0, total: 0, eliminated: false },
    { rank: 6,  team: "TTx",         color: "#F97316", kills: 0, total: 0, eliminated: false },
    { rank: 7,  team: "CODESTROYER", color: "#06B6D4", kills: 0, total: 0, eliminated: false },
    { rank: 8,  team: "REAPER",      color: "#EC4899", kills: 0, total: 0, eliminated: false },
    { rank: 9,  team: "TS",          color: "#EAB308", kills: 0, total: 0, eliminated: false },
    { rank: 10, team: "4DM",         color: "#14B8A6", kills: 0, total: 0, eliminated: false },
    { rank: 11, team: "EQX",         color: "#6366F1", kills: 0, total: 0, eliminated: false },
    { rank: 12, team: "IIIT",        color: "#84CC16", kills: 0, total: 0, eliminated: false },
    { rank: 13, team: "ANURAG",      color: "#A855F7", kills: 0, total: 0, eliminated: false }
  ];

  function renderScoreboard(snapshot) {
    if (!snapshot) return;

    // Independent Visibility Control
    const overlayCfg = snapshot.overlay_config || {};
    const urlParams  = new URLSearchParams(window.location.search);
    const forceShow  = urlParams.get('force') === '1' || urlParams.get('force') === 'true';
    const wrapEl     = document.getElementById('overlay-wrap');
    if (wrapEl) {
      if (forceShow || overlayCfg.scoreboard_visible !== false) {
        wrapEl.classList.remove('hidden');
      } else {
        wrapEl.classList.add('hidden');
      }
    }

    let teams = snapshot.teams;
    if (!teams || teams.length === 0) {
      teams = defaultFallbackTeams;
    }

    // Sort strictly by total points descending
    const sorted = [...teams].sort((a, b) => {
      const ptsA = a.total ?? ((a.kills || 0) + (a.place || 0));
      const ptsB = b.total ?? ((b.kills || 0) + (b.place || 0));
      return ptsB - ptsA;
    });

    // Update Header
    const matchNum = snapshot.match_number || 1;
    const status   = snapshot.status || 'LIVE';
    matchEl.textContent = `M${matchNum} · ${status}`;
    titleEl.textContent = status === 'FINISHED' ? 'FINAL STANDINGS' : 'POINTS TABLE';

    // Build Rows
    let html = '';
    sorted.forEach((t, index) => {
      const rank  = index + 1;
      const teamName = (t.team || 'TEAM').toUpperCase();
      const kills = t.kills ?? 0;
      const pts   = t.total ?? (kills + (t.place ?? 0));
      const color = t.color || '#94A3B8';
      const isElim = Boolean(t.eliminated);

      // Check if points updated since last frame
      const isUpdated = previousPoints[teamName] !== undefined && previousPoints[teamName] !== pts;
      previousPoints[teamName] = pts;

      let rankClass = '';
      if (rank === 1) rankClass = 'rank-1';
      else if (rank === 2) rankClass = 'rank-2';
      else if (rank === 3) rankClass = 'rank-3';

      html += `
        <div class="ov-row ${rankClass} ${isElim ? 'eliminated' : ''} ${isUpdated ? 'row-flash' : ''}">
          <div class="ov-rank">${rank}</div>
          <div class="ov-team">
            <span class="ov-bar" style="background:${color}"></span>
            <span class="ov-name">${teamName}</span>
            ${isElim ? '<span class="ov-elim-pill">OUT</span>' : ''}
          </div>
          <div class="ov-kills">${kills}</div>
          <div class="ov-pts">${pts}</div>
        </div>
      `;
    });

    rowsEl.innerHTML = html;

    // Render Top Fragger / MVP
    const topFrag = snapshot.mvp || (snapshot.top_fraggers && snapshot.top_fraggers[0]);
    const fragCard = document.getElementById('ov-fragger-card');
    if (topFrag && topFrag.player && topFrag.player !== 'None' && (topFrag.kills > 0)) {
      fragCard.style.display = 'flex';
      document.getElementById('ov-frag-name').textContent = topFrag.player;
      document.getElementById('ov-frag-team').textContent = topFrag.team || '—';
      document.getElementById('ov-frag-kills').textContent = topFrag.kills ?? 0;
      const fragBar = document.getElementById('ov-frag-bar');
      if (fragBar) fragBar.style.background = topFrag.color || '#F97316';
    } else {
      fragCard.style.display = 'none';
    }
  }

  // Initial immediate render so OBS is never blank
  renderScoreboard({ teams: defaultFallbackTeams });

  // ── Bulletproof REST Fetcher (Supports both web and local file in OBS) ──
  const baseUrls = [
    (location.origin && location.origin.startsWith('http')) ? location.origin : null,
    'http://127.0.0.1:8000',
    'http://localhost:8000'
  ].filter(Boolean);

  let activeApiBase = baseUrls[0];

  async function fetchScoreboard() {
    for (const base of baseUrls) {
      try {
        const res = await fetch(`${base}/scoreboard`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          activeApiBase = base;
          renderScoreboard(data);
          liveDot.classList.add('connected');
          return;
        }
      } catch (err) {
        // try next endpoint
      }
    }
  }

  // ── WebSocket Connection with 2-Second Auto-Reconnect ──
  let ws = null;

  function connectWebSocket() {
    const wsHost = (location.host && !location.host.startsWith('file')) ? location.host : '127.0.0.1:8000';
    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProto}//${wsHost}/scoreboard`;

    try {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        liveDot.classList.add('connected');
        fetchScoreboard();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          renderScoreboard(data);
          liveDot.classList.add('connected');
        } catch (e) {
          console.error("WS Parse error", e);
        }
      };

      ws.onclose = () => {
        liveDot.classList.remove('connected');
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch(e) {}
      };
    } catch (e) {
      setTimeout(connectWebSocket, 2000);
    }
  }

  // 1. Fetch immediately
  fetchScoreboard();

  // 2. Connect WebSocket for instant zero-latency events
  connectWebSocket();

  // 3. Fallback polling every 1.5 seconds (Guarantees OBS always updates even if WebSocket sleeps)
  setInterval(fetchScoreboard, 1500);
</script>
</body>
</html>
