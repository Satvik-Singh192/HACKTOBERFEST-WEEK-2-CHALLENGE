<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI Live Points Table – OBS Overlay</title>
  <style>
    /* ── Transparent OBS overlay – no shared CSS needed ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: 'Rajdhani', 'Impact', 'Arial Narrow', sans-serif;
      -webkit-font-smoothing: antialiased;
      width: 220px;
    }

    #overlay-wrap {
      width: 220px;
      padding: 0 0 4px;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(8, 10, 14, 0.88);
      border: 1px solid rgba(249,115,22,.35);
      border-top: 3px solid #f97316;
      box-shadow: 0 4px 24px rgba(0,0,0,.7);
    }

    /* header */
    .ov-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px 5px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .ov-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #f97316;
    }
    .ov-match {
      font-size: 10px;
      color: rgba(255,255,255,.45);
      font-weight: 600;
      letter-spacing: .06em;
    }

    /* column headers */
    .ov-col-hdr {
      display: grid;
      grid-template-columns: 28px 1fr 32px 38px;
      padding: 4px 10px 3px;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    /* team rows */
    .ov-rows { display: flex; flex-direction: column; }

    .ov-row {
      display: grid;
      grid-template-columns: 28px 1fr 32px 38px;
      align-items: center;
      padding: 5px 10px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      transition: background .4s;
    }
    .ov-row:last-child { border-bottom: none; }
    .ov-row.eliminated { opacity: .28; }
    .ov-row.rank-1 { background: rgba(249,115,22,.07); }

    .ov-rank {
      font-size: 11px;
      font-weight: 800;
      color: rgba(255,255,255,.35);
      line-height: 1;
    }
    .ov-row.rank-1 .ov-rank { color: #fbbf24; }
    .ov-row.rank-2 .ov-rank { color: #93c5fd; }
    .ov-row.rank-3 .ov-rank { color: #d97706; }

    .ov-team {
      display: flex; align-items: center; gap: 6px;
      overflow: hidden;
    }
    .ov-bar {
      width: 3px; height: 16px; border-radius: 2px; flex-shrink: 0;
    }
    .ov-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ov-row.eliminated .ov-name { text-decoration: line-through; }

    .ov-kills {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,.55);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .ov-pts {
      font-size: 14px;
      font-weight: 800;
      color: #f97316;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .ov-row.rank-1 .ov-pts { color: #fbbf24; }

    /* flash on update */
    @keyframes row-flash {
      0%   { background: rgba(249,115,22,.22); }
      100% { background: transparent; }
    }
    .flash { animation: row-flash .7s ease; }

    /* ws indicator dot – bottom right */
    #ws-dot {
      position: fixed; bottom: 6px; right: 8px;
      width: 6px; height: 6px; border-radius: 50%;
      background: #ef4444;
      transition: background .4s;
    }
    #ws-dot.live { background: #22c55e; }
  </style>
</head>
<body>

<div id="overlay-wrap">
  <div class="ov-header">
    <span class="ov-title" id="ov-title">POINTS TABLE</span>
    <span class="ov-match" id="ov-match">MATCH 1</span>
  </div>
  <div class="ov-col-hdr">
    <span>#</span>
    <span>TEAM</span>
    <span style="text-align:right">K</span>
    <span style="text-align:right">PTS</span>
  </div>
  <div class="ov-rows" id="ov-rows">
    <!-- rendered by JS -->
  </div>
</div>

<div id="ws-dot"></div>

<script>
  const rowsEl  = document.getElementById('ov-rows');
  const titleEl = document.getElementById('ov-title');
  const matchEl = document.getElementById('ov-match');
  const wsDot   = document.getElementById('ws-dot');

  // Track previous totals to flash changed rows
  const prevTotals = {};

  function render(snap) {
    const teams  = (snap.teams || []).slice().sort(
      (a, b) => (b.total ?? 0) - (a.total ?? 0)
    );
    const mapName   = snap.map   || '';
    const matchNum  = snap.match_number || 1;
    const status    = snap.status || 'LIVE';

    titleEl.textContent = status === 'FINISHED' ? 'FINAL STANDINGS' : 'POINTS TABLE';
    matchEl.textContent = `MATCH ${matchNum}${mapName ? ' · ' + mapName.toUpperCase() : ''}`;

    rowsEl.innerHTML = '';
    teams.slice(0, 16).forEach((t, i) => {
      const rank    = i + 1;
      const kills   = t.kills  ?? 0;
      const pts     = t.total  ?? kills;
      const color   = t.color  || '#94a3b8';
      const isElim  = Boolean(t.eliminated);
      const changed = prevTotals[t.team] !== undefined && prevTotals[t.team] !== pts;
      prevTotals[t.team] = pts;

      const row = document.createElement('div');
      row.className = [
        'ov-row',
        rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '',
        isElim ? 'eliminated' : '',
        changed ? 'flash' : '',
      ].filter(Boolean).join(' ');

      row.innerHTML = `
        <div class="ov-rank">${rank}</div>
        <div class="ov-team">
          <span class="ov-bar" style="background:${color}"></span>
          <span class="ov-name">${t.team || '—'}</span>
        </div>
        <div class="ov-kills">${kills}</div>
        <div class="ov-pts">${pts}</div>
      `;
      rowsEl.appendChild(row);
    });
  }

  // ── Initial fetch ──────────────────────────────
  fetch('/scoreboard')
    .then(r => r.json())
    .then(render)
    .catch(() => {});

  // ── WebSocket with auto-reconnect ──────────────
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
               + (location.host || '127.0.0.1:8000')
               + '/scoreboard';
  let ws;

  function connect() {
    try {
      ws = new WebSocket(WS_URL);
      ws.onopen    = () => wsDot.className = 'live';
      ws.onmessage = e => { try { render(JSON.parse(e.data)); } catch {} };
      ws.onclose   = () => { wsDot.className = ''; setTimeout(connect, 3000); };
      ws.onerror   = () => ws.close();
    } catch { setTimeout(connect, 3000); }
  }

  connect();
</script>
</body>
</html>
