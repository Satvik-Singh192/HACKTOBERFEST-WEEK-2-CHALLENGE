<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay - Live Points Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* OBS transparent mode — default when loaded without ?preview=true */
    body {
      background: transparent;
      margin: 0;
      padding: 0;
    }
    body.preview-mode {
      background: #0A0D11;
    }
    .overlay-stage-wrapper {
      background: transparent;
    }
    body.preview-mode .overlay-stage-wrapper {
      background: #0A0D11;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 24px;
    }
    /* Connection indicator */
    #ws-indicator {
      position: fixed;
      bottom: 8px;
      right: 10px;
      font-size: 10px;
      font-family: 'IBM Plex Sans', sans-serif;
      color: rgba(255,255,255,0.25);
      display: none;
    }
    body.preview-mode #ws-indicator { display: block; }
    #ws-indicator.connected { color: #2DD4BF; }
    #ws-indicator.disconnected { color: #F43F5E; }
  </style>
</head>
<body>
  <div class="overlay-stage-wrapper">
    <div class="overlay-stage">
      <!-- Dynamic table — populated entirely by JS -->
      <div class="overlay-table" id="overlay-table">
        <div class="overlay-header" id="overlay-header">
          <span class="overlay-title" id="overlay-title">MATCH 1 · LIVE</span>
          <div class="overlay-header-cols">
            <span style="width: 56px; text-align: right;">KILLS</span>
            <span style="width: 64px; text-align: right;">PTS</span>
          </div>
        </div>
        <!-- rows injected here by renderOverlay() -->
        <div id="overlay-rows"></div>
      </div>
    </div>
  </div>

  <div id="ws-indicator">⬤ connecting…</div>

  <script>
    (function initOverlay() {
      const params = new URLSearchParams(window.location.search);
      const isPreview = params.get('preview') === 'true' || params.get('bg') === 'solid';
      if (isPreview) document.body.classList.add('preview-mode');

      const titleEl  = document.getElementById('overlay-title');
      const rowsEl   = document.getElementById('overlay-rows');
      const wsInd    = document.getElementById('ws-indicator');

      // ── Render ────────────────────────────────────────────────
      function renderOverlay(snapshot) {
        if (!snapshot) return;

        const teams = snapshot.teams || [];
        if (teams.length === 0) {
          rowsEl.innerHTML = '<div style="color:rgba(255,255,255,0.25);font-size:12px;padding:12px 16px;">Waiting for team data…</div>';
          return;
        }

        // Update header title
        const matchNum = snapshot.match_number || 1;
        const statusLabel = snapshot.status === 'FINISHED' ? 'FINAL'
                          : snapshot.status === 'PAUSED'   ? 'PAUSED'
                          : 'LIVE';
        titleEl.textContent = `MATCH ${matchNum} · ${statusLabel}`;

        // Sort by total descending (already sorted from backend, but ensure)
        const sorted = [...teams].sort((a, b) =>
          ((b.total ?? ((b.kills || 0) + (b.place || 0))) -
           (a.total ?? ((a.kills || 0) + (a.place || 0)))));

        rowsEl.innerHTML = sorted.slice(0, 16).map((t, idx) => {
          const rank   = idx + 1;
          const kills  = t.kills  ?? 0;
          const total  = t.total  ?? (kills + (t.place ?? 0));
          const color  = t.color  || '#94A3B8';
          const isTop  = rank === 1;
          const isElim = Boolean(t.eliminated);

          return `
            <div class="overlay-row${isElim ? ' eliminated' : ''}">
              <div class="overlay-rank">${rank}</div>
              <span class="overlay-bar" style="background-color:${color};"></span>
              <div class="overlay-name">${t.team || 'TEAM'}</div>
              <div class="overlay-kills">${kills}</div>
              <div class="overlay-pts${isTop ? ' amber' : ''}">${total}</div>
            </div>`;
        }).join('');
      }

      // ── Initial REST fetch ─────────────────────────────────────
      fetch('/scoreboard')
        .then(r => r.json())
        .then(data => renderOverlay(data))
        .catch(() => {}); // WS will handle it anyway

      // ── WebSocket with auto-reconnect ─────────────────────────
      const wsBase = (location.protocol === 'https:' ? 'wss://' : 'ws://')
                   + (location.host || '127.0.0.1:8000');
      let ws;

      function connect() {
        try {
          ws = new WebSocket(wsBase + '/scoreboard');

          ws.onopen = () => {
            wsInd.textContent = '⬤ live';
            wsInd.className = 'connected';
          };

          ws.onmessage = (event) => {
            try {
              renderOverlay(JSON.parse(event.data));
            } catch (e) { console.error('overlay WS parse error:', e); }
          };

          ws.onclose = () => {
            wsInd.textContent = '⬤ reconnecting…';
            wsInd.className = 'disconnected';
            setTimeout(connect, 3000);
          };

          ws.onerror = () => ws.close();

        } catch (e) { setTimeout(connect, 3000); }
      }

      connect();
    })();
  </script>
</body>
</html>
